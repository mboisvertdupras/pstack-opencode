name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check that the tag matches src/package.json
        run: |
          version="$(node -p 'require("./src/package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src/package.json version $version"
            exit 1
          fi

      - run: npm --version
      - run: npm test
      - run: npm run lint -- src/skills src/agents

      - name: Publish to npm
        working-directory: src
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: npm publish --tag latest
